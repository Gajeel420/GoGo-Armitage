[workspace]
members = ["armitage-core", "armitage-api", "armitage-viz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GoGo-Armitage Contributors"]
license = "BSD-2-Clause"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmpv = { version = "1.1", features = ["with-serde"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros"] }

# HTTP/API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.12"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Graph algorithms
petgraph = "0.6"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.14"
dotenv = "0.15"

# Testing
mockito = "1.6"
